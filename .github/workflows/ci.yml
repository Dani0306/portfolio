# Runs on every push and pull request: types, unit tests, contrast, build and browser tests.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm test

      - name: WCAG AA contrast over every stop
        run: npm run contrast

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build and browser tests (Playwright, Chromium and WebKit)
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
